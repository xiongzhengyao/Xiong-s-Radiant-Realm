<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="200" x2="400" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2997ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <ellipse cx="400" cy="420" rx="280" ry="200" fill="url(#glow)"/>
  <!-- desk -->
  <rect x="120" y="620" width="560" height="12" rx="4" fill="white" fill-opacity="0.08"/>
  <!-- monitor -->
  <rect x="220" y="280" width="360" height="220" rx="12" fill="#1c2128" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="240" y="300" width="320" height="170" rx="6" fill="#0d1117"/>
  <!-- code lines -->
  <rect x="260" y="320" width="180" height="8" rx="2" fill="#2997ff" fill-opacity="0.7"/>
  <rect x="260" y="340" width="240" height="6" rx="2" fill="white" fill-opacity="0.2"/>
  <rect x="260" y="358" width="200" height="6" rx="2" fill="white" fill-opacity="0.15"/>
  <rect x="260" y="376" width="220" height="6" rx="2" fill="white" fill-opacity="0.12"/>
  <rect x="260" y="394" width="160" height="6" rx="2" fill="#34c759" fill-opacity="0.5"/>
  <rect x="260" y="420" width="260" height="6" rx="2" fill="white" fill-opacity="0.1"/>
  <!-- camera module -->
  <rect x="500" y="480" width="100" height="100" rx="16" fill="#1c2128" stroke="white" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="550" cy="520" r="28" fill="#0d1117" stroke="#2997ff" stroke-opacity="0.6" stroke-width="3"/>
  <circle cx="550" cy="520" r="12" fill="#2997ff" fill-opacity="0.4"/>
  <!-- stand -->
  <rect x="370" y="500" width="60" height="120" rx="4" fill="#1c2128"/>
  <rect x="350" y="618" width="100" height="8" rx="2" fill="white" fill-opacity="0.06"/>
</svg>
